name: Run Python Tests

# Вказуємо події, які запускають workflow
on:
  push:
    branches: [ "master", "main" ] # Запуск при пуші в master/main
  pull_request:
    branches: [ "master", "main" ] # Запуск при створенні Pull Request у master/main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    # 1. Клонуємо репозиторій у контейнер
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Налаштовуємо Python необхідної версії
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'
        cache: 'pip'

    # 3. Встановлюємо залежності з requirements.txt та інструмент для тестів (pytest)
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    # 4. Запускаємо тести з папки tests/
    - name: Run tests with pytest
      run: |
        pytest
